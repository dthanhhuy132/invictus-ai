<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Migration & QA Checklist App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-md-10">
        <div class="card shadow-sm">
          <div class="card-body text-center">
            <h1 class="card-title mb-4">Migration & QA Checklist App</h1>
            <p class="lead mb-4">Công cụ hỗ trợ:
            <ul class="text-start d-inline-block">
              <li><b>Migration Map</b>: Phân tích, chuyển đổi code giữa các ngôn ngữ.</li>
              <li><b>QA Checklist Generator</b>: Sinh checklist kiểm thử thủ công tự động bằng AI.</li>
            </ul>
            </p>
            <button class="btn btn-primary btn-lg" onclick="window.location.href='/migration_map'">Start Process
              &rarr;</button>
            <br><br>
            <button class="btn btn-outline-secondary btn-sm" id="setApiKeyBtn">Set OpenAI API Key</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Modal for API Key -->
  <div class="modal fade" id="apiKeyModal" tabindex="-1" aria-labelledby="apiKeyModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="apiKeyModalLabel">Set OpenAI API Key</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="password" id="apiKeyInput" class="form-control" placeholder="sk-..." autocomplete="off">
          <div class="form-text">API key sẽ được lưu trên trình duyệt của bạn (localStorage).</div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary" id="saveApiKeyBtn">Save</button>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const setApiKeyBtn = document.getElementById('setApiKeyBtn');
    const apiKeyModal = new bootstrap.Modal(document.getElementById('apiKeyModal'));
    const apiKeyInput = document.getElementById('apiKeyInput');
    const saveApiKeyBtn = document.getElementById('saveApiKeyBtn');
    setApiKeyBtn.onclick = () => {
      apiKeyInput.value = localStorage.getItem('openai_api_key') || '';
      apiKeyModal.show();
    };
    saveApiKeyBtn.onclick = () => {
      localStorage.setItem('openai_api_key', apiKeyInput.value.trim());
      apiKeyModal.hide();
    };
  </script>
</body>

</html>
