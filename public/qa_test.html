<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QA Checklist Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
    }

    .main-card {
      border: none;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.95);
    }

    .form-control,
    .form-select {
      border: 2px solid #e9ecef;
      border-radius: 12px;
      padding: 12px 16px;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.9);
    }

    .form-control:focus,
    .form-select:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
      transform: translateY(-2px);
    }

    .btn-primary {
      background: linear-gradient(45deg, #667eea, #764ba2);
      border: none;
      border-radius: 12px;
      padding: 12px 30px;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      border-radius: 12px;
      padding: 10px 20px;
      transition: all 0.3s ease;
    }

    .btn-secondary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .btn-success {
      border-radius: 12px;
      padding: 10px 20px;
      transition: all 0.3s ease;
    }

    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(25, 135, 84, 0.3);
    }

    .card-title {
      background: linear-gradient(45deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
    }

    .progress {
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.3);
    }

    .progress-bar {
      background: linear-gradient(45deg, #667eea, #764ba2);
      border-radius: 12px;
    }

    .alert {
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .list-group-item {
      border: none;
      border-radius: 8px;
      margin-bottom: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      transition: all 0.3s ease;
    }

    .list-group-item:hover {
      transform: translateX(5px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .btn-outline-secondary {
      border-radius: 12px;
      transition: all 0.3s ease;
    }

    .btn-outline-secondary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>

<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-9 col-md-11">
        <div class="card main-card">
          <div class="card-body p-5">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h1 class="card-title mb-0">QA Checklist Generator</h1>
              <button class="btn btn-outline-secondary btn-sm" id="setApiKeyBtn">Set API Key</button>
            </div>
            <form id="qaForm">
              <div class="mb-3">
                <label class="form-label">Source Directory (on server):</label>
                <input type="text" name="srcDir" class="form-control" required placeholder="e.g., example/src"
                  id="srcDirInput">
              </div>
              <div class="mb-3">
                <label class="form-label">Output file name (.xlsx):</label>
                <input type="text" name="outputFile" class="form-control" value="manual-checklist.xlsx">
              </div>
              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" value="1" id="generatePdf" name="generatePdf" checked>
                <label class="form-check-label" for="generatePdf">Generate PDF checklist</label>
              </div>
              <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg" id="generateBtn">Generate QA Checklist</button>
              </div>
              <div class="progress mt-3" id="progressBarContainer" style="display:none; height:8px;">
                <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar"
                  style="width: 100%;" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100"></div>
              </div>
            </form>
            <div class="result mt-4" id="result"></div>
            <div class="download-links mt-2" id="downloadLinks"></div>
            <div class="error mt-3" id="error"></div>
            <div class="row mt-4">
              <div class="col-6 text-start">
                <a href="/" class="btn btn-secondary">&larr; Back</a>
              </div>
              <div class="col-6 text-end">
                <a href="/migration_map" class="btn btn-success">Previous: Migration Map &larr;</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal for API Key -->
  <div class="modal fade" id="apiKeyModal" tabindex="-1" aria-labelledby="apiKeyModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content" style="border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
        <div class="modal-header">
          <h5 class="modal-title" id="apiKeyModalLabel">Set OpenAI API Key</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="password" id="apiKeyInput" class="form-control" placeholder="sk-..." autocomplete="off">
          <div class="form-text">API key will be saved in your browser (localStorage).</div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary" id="saveApiKeyBtn">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal to view PDF -->
  <div class="modal fade" id="pdfModal" tabindex="-1" aria-labelledby="pdfModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
      <div class="modal-content" style="border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
        <div class="modal-header">
          <h5 class="modal-title" id="pdfModalLabel">View PDF File</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" style="height:80vh;">
          <iframe id="pdfFrame" src="" style="width:100%;height:100%;border:none;"></iframe>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const form = document.getElementById('qaForm');
    const resultDiv = document.getElementById('result');
    const errorDiv = document.getElementById('error');
    const downloadLinks = document.getElementById('downloadLinks');
    const setApiKeyBtn = document.getElementById('setApiKeyBtn');
    const apiKeyModal = new bootstrap.Modal(document.getElementById('apiKeyModal'));
    const apiKeyInput = document.getElementById('apiKeyInput');
    const saveApiKeyBtn = document.getElementById('saveApiKeyBtn');
    const progressBarContainer = document.getElementById('progressBarContainer');
    const generateBtn = document.getElementById('generateBtn');
    const srcDirInput = document.getElementById('srcDirInput');

    // Load source directory from URL parameter or localStorage
    document.addEventListener('DOMContentLoaded', function () {
      const urlParams = new URLSearchParams(window.location.search);
      const sourceDirFromUrl = urlParams.get('sourceDir');
      const sourceDirFromStorage = localStorage.getItem('source_directory');

      if (sourceDirFromUrl) {
        srcDirInput.value = sourceDirFromUrl;
      } else if (sourceDirFromStorage) {
        srcDirInput.value = sourceDirFromStorage;
      }

      // Load saved form values
      const savedOutputFile = localStorage.getItem('qa_test_output_file');
      const savedGeneratePdf = localStorage.getItem('qa_test_generate_pdf');

      if (savedOutputFile) form.querySelector('input[name="outputFile"]').value = savedOutputFile;
      if (savedGeneratePdf) form.querySelector('input[name="generatePdf"]').checked = savedGeneratePdf === 'true';

      // Restore previous result if exists
      const qaTestGenerated = localStorage.getItem('qa_test_generated');
      const qaTestFileUrl = localStorage.getItem('qa_test_file_url');
      const qaTestPdfUrl = localStorage.getItem('qa_test_pdf_url');

      if (qaTestGenerated === 'true') {
        downloadLinks.innerHTML = '<div class="alert alert-success"><h5>✅ QA Checklist Generated Successfully!</h5><p>Your QA checklist has been created and is ready for download.</p></div>';

        let downloadButtons = '<div class="d-flex gap-2 mt-3">';
        if (qaTestFileUrl) {
          downloadButtons += '<a class="btn btn-success" href="' + qaTestFileUrl + '" download><i class="bi bi-file-earmark-excel"></i> Download Excel</a>';
        }
        if (qaTestPdfUrl) {
          downloadButtons += '<a class="btn btn-warning" href="' + qaTestPdfUrl + '" download><i class="bi bi-file-earmark-pdf"></i> Download PDF</a>';
          downloadButtons += '<button class="btn btn-outline-dark" id="viewPdfBtn"><i class="bi bi-eye"></i> View PDF</button>';
        }
        downloadButtons += '</div>';
        downloadLinks.innerHTML += downloadButtons;
      }
    });

    setApiKeyBtn.onclick = () => {
      apiKeyInput.value = localStorage.getItem('openai_api_key') || '';
      apiKeyModal.show();
    };

    saveApiKeyBtn.onclick = () => {
      localStorage.setItem('openai_api_key', apiKeyInput.value.trim());
      apiKeyModal.hide();
    };

    form.onsubmit = async (e) => {
      e.preventDefault();
      resultDiv.innerHTML = '';
      errorDiv.textContent = '';
      downloadLinks.innerHTML = '';
      progressBarContainer.style.display = 'block';
      generateBtn.disabled = true;

      const formData = new FormData(form);
      const data = {
        srcDir: formData.get('srcDir'),
        outputFile: formData.get('outputFile'),
        generatePdf: formData.get('generatePdf') === '1'
      };

      // Save form values to localStorage
      localStorage.setItem('qa_test_output_file', data.outputFile);
      localStorage.setItem('qa_test_generate_pdf', data.generatePdf.toString());

      try {
        const headers = { 'Content-Type': 'application/json' };
        const apiKey = localStorage.getItem('openai_api_key');
        if (apiKey) headers['x-openai-api-key'] = apiKey;

        const res = await fetch('/generate_checklist', {
          method: 'POST',
          headers,
          body: JSON.stringify(data)
        });

        const json = await res.json();
        if (!res.ok) {
          errorDiv.innerHTML = "<div class='alert alert-danger'>" + (json.error || 'Unknown error') + "</div>";
          return;
        }

        resultDiv.innerHTML = '';
        downloadLinks.innerHTML = '<div class="alert alert-success"><h5>✅ QA Checklist Generated Successfully!</h5><p>Your QA checklist has been created and is ready for download.</p></div>';

        let downloadButtons = '<div class="d-flex gap-2 mt-3">';
        if (json.fileUrl) {
          downloadButtons += '<a class="btn btn-success" href="' + json.fileUrl + '" download><i class="bi bi-file-earmark-excel"></i> Download Excel</a>';
        }
        if (json.pdfUrl) {
          downloadButtons += '<a class="btn btn-warning" href="' + json.pdfUrl + '" download><i class="bi bi-file-earmark-pdf"></i> Download PDF</a>';
          downloadButtons += '<button class="btn btn-outline-dark" id="viewPdfBtn"><i class="bi bi-eye"></i> View PDF</button>';
        }
        downloadButtons += '</div>';
        downloadLinks.innerHTML += downloadButtons;

        // Save result to localStorage
        localStorage.setItem('qa_test_generated', 'true');
        if (json.fileUrl) localStorage.setItem('qa_test_file_url', json.fileUrl);
        if (json.pdfUrl) localStorage.setItem('qa_test_pdf_url', json.pdfUrl);

      } catch (err) {
        errorDiv.innerHTML = "<div class='alert alert-danger'>" + err.message + "</div>";
      } finally {
        progressBarContainer.style.display = 'none';
        generateBtn.disabled = false;
      }
    };

    // Logic to open PDF modal when clicking the button
    document.addEventListener('click', function (e) {
      if (e.target && e.target.id === 'viewPdfBtn') {
        const pdfUrl = document.querySelector('a.btn-warning')?.getAttribute('href');
        if (pdfUrl) {
          document.getElementById('pdfFrame').src = pdfUrl;
          const pdfModal = new bootstrap.Modal(document.getElementById('pdfModal'));
          pdfModal.show();
        }
      }
    });
  </script>
</body>

</html>
