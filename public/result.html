<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Result Files</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-md-10">
        <div class="card shadow-sm">
          <div class="card-body">
            <h1 class="card-title mb-4">Danh sách file kết quả</h1>
            <div id="fileList">Đang tải...</div>
            <a href="/" class="btn btn-link mt-4">&larr; Quay về trang chủ</a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    async function loadFiles() {
      const fileListDiv = document.getElementById('fileList');
      try {
        const res = await fetch('/api/results');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Lỗi không xác định');
        if (!data.files || data.files.length === 0) {
          fileListDiv.innerHTML = '<div class="alert alert-info">Chưa có file kết quả nào.</div>';
          return;
        }
        let html = '<ul class="list-group">';
        for (const file of data.files) {
          html += `<li class="list-group-item d-flex justify-content-between align-items-center">
            <span>${file}</span>
            <a class="btn btn-sm btn-primary" href="/example/result/${file}" target="_blank">Tải/Xem</a>
          </li>`;
        }
        html += '</ul>';
        fileListDiv.innerHTML = html;
      } catch (err) {
        fileListDiv.innerHTML = `<div class='alert alert-danger'>${err.message}</div>`;
      }
    }
    loadFiles();
  </script>
</body>

</html>
